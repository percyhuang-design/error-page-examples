<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>網頁服務錯誤狀況與處理方式</title>
<meta name="description" content="23 種網頁服務錯誤狀況的清單、處理層級與可互動的 UI 模擬。">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#F5F6F8;color:#1F2328;font-family:Roboto,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14px;line-height:1.5}
a{color:#1F5FD1}a:hover{color:#174CB0}
p,h1,h2,h3,ul{margin:0}
code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:0 24px;background:#FFFFFF;border-bottom:1px solid #DCDFE4}
.top-title{font-weight:700;font-size:15px;padding:12px 0}
.tabs{display:flex;gap:24px;align-self:stretch}
.tab{position:relative;display:flex;align-items:center;height:48px;padding:0;border:0;background:none;font:inherit;font-weight:500;color:#57606A;cursor:pointer;text-decoration:none}
.tab:hover{color:#1F2328}
.tab[aria-selected="true"]{color:#1F2328}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:#1F5FD1}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:4px;border:1px solid #CDD1D7;background:#FFFFFF;color:#1F2328;font-family:inherit;font-size:14px;font-weight:500;line-height:1;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#1F5FD1;color:#1F5FD1}
.btn-p{background:#1F5FD1;border-color:#1F5FD1;color:#FFFFFF}
.btn-p:hover{background:#174CB0;border-color:#174CB0;color:#FFFFFF}
.btn-d{color:#B42318}.btn-d:hover{border-color:#B42318;color:#8E1B12}
.btn-t{background:transparent;border-color:transparent}
.btn-t:hover{background:#EEF0F3;border-color:transparent;color:#1F2328}
.btn-sm{height:28px;padding:0 10px}
.btn-i{width:32px;padding:0}.btn-sm.btn-i{width:28px}
.btn:disabled,.btn:disabled:hover{background:#EEF0F3;border-color:transparent;color:#8C949E;cursor:not-allowed}
.fld{width:100%;height:32px;padding:0 12px;border:1px solid #CDD1D7;border-radius:4px;background:#FFFFFF;font-family:inherit;font-size:14px;color:#1F2328}
.fld:hover{border-color:#9AA1AB}.fld:focus{outline:none;border-color:#1F5FD1}
.fld-err,.fld-err:hover{border-color:#C4271F}
textarea.fld{height:auto;padding:8px 12px;resize:vertical;line-height:1.5}
.fld::placeholder{color:#6E7781}
.field{display:flex;flex-direction:column;gap:4px}
.req{color:#6E7781}
.err-msg{color:#B42318}
.help{color:#57606A}
.range{display:flex;align-items:center;gap:8px}

/* tags */
.tag{display:inline-flex;align-items:center;min-height:22px;padding:0 6px;border-radius:4px;font-size:12px;font-weight:500}
.tag-code{background:#EEF0F3;color:#3D444D;font-family:ui-monospace,Menlo,Consolas,monospace}

/* overview */
.wrap{max-width:1360px;margin:0 auto;padding:48px 24px 80px;display:flex;flex-direction:column;gap:48px}
.eyebrow{font-size:12px;font-weight:500;color:#57606A}
.h1{font-size:32px;line-height:1.3;font-weight:700}
.h2{font-size:20px;line-height:1.3;font-weight:700}
.lead{font-size:16px;color:#3D444D;max-width:880px}
.card{background:#FFFFFF;border:1px solid #DCDFE4;border-radius:8px}
.grid-lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.grid-rule{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.tbl-scroll{overflow-x:auto}
.tbl{min-width:1240px}
.tr{display:grid;grid-template-columns:44px 170px 96px 140px minmax(220px,1fr) minmax(300px,1.4fr) 210px;gap:16px;padding:14px 16px;border-bottom:1px solid #E3E5E8;align-items:start}
.tr.th{padding:10px 16px;background:#F0F1F3;color:#57606A}
.tr:last-child{border-bottom:0}
.tr-g{padding:14px 16px 8px;border-bottom:1px solid #E3E5E8;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.row-link{color:inherit;text-decoration:none;font-weight:500}
.row-link:hover{color:#1F5FD1;text-decoration:underline}

/* simulator */
.sim{display:flex;flex-wrap:wrap;min-height:calc(100vh - 49px);background:#E9EBEF}
.sim-side{flex:1 1 280px;background:#FFFFFF;border-right:1px solid #DCDFE4;padding:20px 12px 32px;display:flex;flex-direction:column;gap:16px}
.pick{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;padding:6px 10px;border:0;border-radius:4px;background:transparent;color:#1F2328;font-family:inherit;font-size:14px;text-align:left;cursor:pointer}
.pick:hover{background:#F0F1F3}
.pick[aria-pressed="true"]{background:#E8F0FE;color:#174CB0}
.sim-main{flex:999 1 640px;min-width:0;padding:24px;display:flex;flex-direction:column;gap:16px}
.frame{position:relative;height:720px;border:1px solid #C4C9D0;border-radius:8px;overflow:hidden;background:#F5F6F8}
.frame-scroll{position:absolute;inset:0;overflow:auto}
.frame-inner{min-width:960px;height:100%;display:flex;flex-direction:column}
.nav{display:flex;align-items:center;width:100%;height:36px;padding:0 16px;border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:500;color:#57606A;text-align:left;cursor:pointer}
.nav:hover{background:#F0F1F3;color:#1F2328}
.nav.on{background:#E8F0FE;color:#1F2328}
.logo{width:24px;height:24px;border-radius:4px;background:#1F5FD1;color:#FFFFFF;display:grid;place-content:center;font-size:12px;font-weight:700}
.banner{display:flex;align-items:center;gap:8px;padding:10px 16px}
.alert{display:flex;align-items:flex-start;gap:8px;padding:12px 16px;border-radius:4px;border:1px solid}
.alert-ic{height:21px;display:flex;align-items:center}
.a-err{border-color:#F0B3AE;background:#FDECEC}.a-err .alert-ic{color:#B42318}
.a-warn{border-color:#EBCB7E;background:#FFF4DB}.a-warn .alert-ic{color:#6F4A00}
.a-ok{border-color:#A8D9B6;background:#E7F6EC}.a-ok .alert-ic{color:#1A6B33}
.a-neutral{border-color:#DCDFE4;background:#F5F6F8}.a-neutral .alert-ic{color:#3D444D}
.t-strong{font-weight:500}
.t-sub{color:#3D444D}
.stat{background:#FFFFFF;border:1px solid #E3E5E8;border-radius:4px;padding:12px 16px;min-height:92px}
.stat-v{margin-top:2px;font-size:24px;line-height:1.3;font-weight:700}
.stat-v span{font-size:14px;font-weight:400}
.cap{font-size:12px;color:#57606A}
.lt{background:#FFFFFF;border:1px solid #E3E5E8;border-radius:4px;overflow:hidden}
.lr{display:grid;grid-template-columns:40px 140px 110px minmax(0,1fr) 64px 96px 48px;align-items:center;height:40px;border-bottom:1px solid #E3E5E8}
.lr>span{padding:0 12px}
.lr>span.c{padding:0;display:flex;justify-content:center}
.lr.th{background:#F0F1F3;color:#57606A}
.num{font-variant-numeric:tabular-nums}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.skel{display:block;height:12px;background:#E6E8EB;border-radius:4px;animation:pulse 1.4s ease-in-out infinite}
.errpage{max-width:500px;margin:0 auto;padding:72px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.bigic{width:64px;height:64px;border-radius:50%;background:#EEF0F3;color:#3D444D;display:grid;place-content:center}
.code-lbl{margin-top:4px;font-size:12px;font-weight:700;color:#57606A}
.err-h{font-size:24px;line-height:1.3;font-weight:700}
.actions{display:flex;gap:8px;margin-top:8px}
.overlay{position:absolute;inset:0;background:rgba(15,23,42,.42)}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px}
.dlg{background:#FFFFFF;border:1px solid #DCDFE4;border-radius:8px;box-shadow:0 12px 32px rgba(15,23,42,.2);display:flex;flex-direction:column}
.dlg-h{padding:8px 8px 8px 16px;min-height:48px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #E3E5E8}
.dlg-h p{flex:1;font-size:16px;font-weight:500}
.dlg-b{padding:16px;display:flex;flex-direction:column;gap:12px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid #E3E5E8}
.sheet{position:absolute;top:0;right:0;bottom:0;width:420px;max-width:100%;background:#FFFFFF;border-left:1px solid #DCDFE4;box-shadow:-8px 0 24px rgba(15,23,42,.12);display:flex;flex-direction:column}
.sheet-b{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 32px;display:flex;flex-direction:column;gap:16px}
.toast{position:absolute;right:16px;bottom:16px;width:380px;display:flex;align-items:flex-start;gap:8px;padding:12px 8px 12px 16px;background:#FFFFFF;border:1px solid #DCDFE4;border-radius:8px;box-shadow:0 12px 32px rgba(15,23,42,.18)}
.file{display:flex;align-items:flex-start;gap:8px;padding:8px 8px 8px 12px;border:1px solid #E3E5E8;border-radius:4px;background:#FFFFFF}
.file.bad{border-color:#F0B3AE}
.diff{border:1px solid #E3E5E8;border-radius:4px;overflow:hidden}
.diff>div{display:grid;grid-template-columns:96px 1fr 1fr;border-bottom:1px solid #E3E5E8}
.diff>div:last-child{border-bottom:0}
.diff span{padding:8px 12px}
.diff .th{background:#F0F1F3;color:#57606A}
[hidden]{display:none!important}
</style>
</head>

<a class="tab" role="tab" id="tab-list" href="#list" aria-controls="view-list">清單與原則</a>
<a class="tab" role="tab" id="tab-sim" href="#sim" aria-controls="view-sim">錯誤狀況模擬器</a>

</header>

<main id="view-list" role="tabpanel" aria-labelledby="tab-list"></main>
<main id="view-sim" role="tabpanel" aria-labelledby="tab-sim" hidden>
<div class="sim">
<aside class="sim-side">
<div style="padding:0 10px;display:flex;flex-direction:column;gap:4px">
<h1 style="font-size:18px;line-height:1.3;font-weight:700">錯誤狀況模擬器</h1>

</aside>
<div class="sim-main">
<section id="info" class="card" aria-live="polite" style="padding:16px 20px;display:flex;flex-direction:column;gap:12px"></section>
<div class="frame" aria-label="模擬畫面"><div id="frame"></div></div>
</div>
</div>
</main>

      h += '<div role="status" style="display:flex;align-items:center;gap:8px;padding:12px 16px;background:#E8F0FE;border-bottom:1px solid #E3E5E8"><span style="color:#0B3E8F;display:flex">' + ic('clock') + '</span>' +
        '<span style="flex:1">載入時間比平常久，可能是網路較慢。我們會繼續嘗試，你也可以重新載入。</span><button class="btn btn-sm">重新載入</button></div>';
      ['160px', '120px', '180px', '140px', '100px'].forEach(function (w) {
        h += '<div class="lr"><span></span><span><span class="skel" style="width:96px"></span></span><span><span class="skel" style="width:48px"></span></span><span><span class="skel" style="width:' + w + '"></span></span><span><span class="skel" style="width:24px;margin-left:auto"></span></span><span><span class="skel" style="width:56px;height:18px"></span></span><span></span></div>';
      });
    } else if (f.empty) {
      h += '<div style="padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">' +
        '<span style="width:48px;height:48px;border-radius:50%;background:#F0F1F3;color:#57606A;display:grid;place-content:center">' + ic('search', 24) + '</span>' +
        '<p style="margin-top:4px;font-size:16px;font-weight:500">找不到符合條件的申請</p><p style="color:#57606A;max-width:400px">目前條件：關鍵字「婚假」、期間「2026 年」。試試其他關鍵字，或清除篩選看全部申請。</p>' +
        '<div class="actions"><button class="btn">清除篩選</button><button class="btn btn-p">新增申請</button></div></div>';
    } else {
      rows(f).forEach(function (r) {
        var s = ST[r.st];
        h += '<div class="lr"><span class="c"><input type="checkbox" aria-label="選取 ' + r.no + '"' + (r.checked ? ' checked' : '') + '></span>' +
          '<span class="num">' + r.no + '</span><span>' + r.type + '</span><span class="num ell">' + r.range + '</span><span class="num" style="text-align:right">' + r.days + '</span>' +
          '<span><span class="tag" style="font-size:13px;font-weight:400;background:' + s[0] + ';color:' + s[1] + '">' + r.st + '</span></span>' +
          '<span class="c"><button class="btn btn-sm btn-t btn-i" style="height:24px;width:24px" aria-label="更多操作">' + DOTS + '</button></span></div>';
      });
    }
    h += '</div>';
    var info = f.empty ? '共 0 筆' : (f.timeout ? '載入中…' : '第 1–6 筆，共 6 筆');
    h += '<div style="display:flex;align-items:center;justify-content:space-between;color:#57606A"><span>' + info + '</span><div style="display:flex;gap:4px;align-items:center">' +
      '<button class="btn btn-sm btn-t btn-i" aria-label="上一頁" disabled>' + ic('chevL') + '</button><button class="btn btn-sm btn-i" style="border-color:#1F5FD1;color:#1F5FD1" aria-current="page">1</button><button class="btn btn-sm btn-t btn-i" aria-label="下一頁" disabled>' + ic('chevR') + '</button></div></div>';
    return h + '</div>';
  }

  function errPage(icon, code, title, body, actions, extra, icStyle, tail) {
    return '<div class="errpage"><span class="bigic"' + (icStyle ? ' style="' + icStyle + '"' : '') + '>' + ic(icon, 28) + '</span><p class="code-lbl">' + code + '</p>' +
      '<h2 class="err-h">' + title + '</h2><p class="t-sub">' + body + '</p>' + (extra || '') + (actions ? '<div class="actions">' + actions + '</div>' : '') + (tail || '') + '</div>';
  }

  function fullContent(f) {
    if (f.e404) return errPage('compass', '404', '找不到這個頁面', '網址可能打錯了，或這個頁面已經搬到別的地方。',
      '<button class="btn">回上一頁</button><button class="btn btn-p">回到首頁</button>',
      '<code style="padding:4px 8px;border-radius:4px;background:#EEF0F3;color:#3D444D;font-size:13px">portal.company.com/leave/reqeusts</code>', '',
      '<p style="margin-top:16px;color:#57606A">你可能在找：<a href="#" onclick="return false">請假申請</a> · <a href="#" onclick="return false">報帳</a> · <a href="#" onclick="return false">薪資單</a></p>');
    if (f.e403) {
      var act = state.requested ? '' : '<button class="btn">切換帳號</button><button class="btn btn-p" data-act="request">申請存取權限</button>';
      var done = state.requested ? '<div style="margin-top:8px;text-align:left">' + alertBox('ok', 'check', '<span>已送出申請給你的主管王志明。核准後會寄 Email 通知你，通常 1 個工作天內。</span>') + '</div>' : '';
      return errPage('lock', '403', '你沒有查看「部門請假總覽」的權限', '這個頁面只開放給部門主管與 HR。你目前以 <b class="t-strong" style="color:#1F2328">林雅婷（yating.lin@company.com）</b>登入。', act, done, '',
        '<p style="margin-top:16px;color:#57606A">有疑問？聯絡 <a href="#" onclick="return false">IT 服務台</a></p>');
    }
    if (f.e410) return errPage('unlink', '410', '這筆申請已不存在', 'LV-2026-0402 已於 10/12 由申請人撤回並刪除，所以通知信裡的連結已經失效。', '<button class="btn btn-p">查看我的申請</button>');
    if (f.e500) return errPage('server', '500', '系統發生錯誤', '這是系統的問題，不是你操作錯誤，工程團隊已經收到通知。你可以稍後重試；如果一直發生，請把下面的錯誤編號提供給 IT 服務台。',
      '<button class="btn">回報問題</button><button class="btn btn-p">' + ic('refresh') + '重試</button>',
      '<div style="display:flex;align-items:center;gap:12px;padding:8px 8px 8px 12px;border:1px solid #DCDFE4;border-radius:4px;background:#FFFFFF;text-align:left"><div><p class="mono t-strong">ERR-7F3A-29C1</p><p class="cap">2026/10/28 13:42:07</p></div>' +
      '<button class="btn btn-sm btn-t" data-act="copy">' + ic('copy') + '<span>複製</span></button></div>', 'background:#FDECEC;color:#B42318');
    if (f.e502) return errPage('refresh', '502 / 504', '暫時無法連線到假別服務', 'HR 系統目前沒有回應，通常幾分鐘內就會恢復。你不需要做任何事，我們會自動重試。', '<button class="btn btn-p">立即重試</button>',
      '<div style="width:280px;display:flex;flex-direction:column;gap:6px;margin-top:4px"><div style="height:4px;border-radius:2px;background:#E3E5E8;overflow:hidden"><div style="width:60%;height:100%;background:#2F6FDE"></div></div><p class="cap">12 秒後自動重試（第 2 次）</p></div>');
    return '';
  }

  function maintenance() {
    return '<div style="min-height:100%;background:#FFFFFF;display:flex;flex-direction:column">' +
      '<div style="height:48px;padding:0 24px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #E3E5E8"><span class="logo">員</span><span class="t-strong">員工服務入口</span></div>' +
      errPage('wrench', '503', '系統維護中', '員工服務入口正在進行例行維護，請假、報帳、薪資單暫時無法使用。', '',
        '<p style="font-size:16px;font-weight:500">預計恢復：今天 18:00</p><div style="width:100%;margin-top:8px;text-align:left">' +
        alertBox('neutral', 'info', '<p class="t-strong">維護期間需要請假？</p><p class="t-sub">請先直接告知主管，系統恢復後再補登。其他急事請撥 IT 服務台分機 [分機號碼]。</p>') +
        '</div><a href="#" onclick="return false" class="t-strong" style="margin-top:8px">查看維護公告</a>', 'background:#E8F0FE;color:#174CB0') + '</div>';
  }

  function sso() {
    return '<div style="min-height:100%;background:#F5F6F8;display:flex;align-items:center;justify-content:center;padding:48px 24px">' +
      '<div class="card" style="width:420px;padding:32px;display:flex;flex-direction:column;gap:16px">' +
      '<div style="display:flex;align-items:center;gap:8px"><span class="logo" style="width:28px;height:28px;font-size:14px">員</span><span style="font-size:16px;font-weight:500">員工服務入口</span></div>' +
      alertBox('err', 'userX', '<p class="t-strong">這個帳號還沒有開通員工服務入口</p><p class="t-sub">你以 <b class="t-strong" style="color:#1F2328">wu.jiahao@partner-vendor.com</b> 登入。外包與合作夥伴帳號需要由部門窗口申請開通。</p>', '', 'alert') +
      '<button class="btn btn-p" style="height:36px">使用其他帳號登入</button><a href="#" onclick="return false" class="t-strong" style="text-align:center">如何申請開通</a>' +
      '<p class="cap" style="padding-top:12px;border-top:1px solid #E3E5E8">錯誤代碼：AADSTS50105 · 2026/10/28 13:42 · 回報時請附上此代碼</p></div></div>';
  }

  function sel(id, val) { return '<select id="' + id + '" class="fld">' + ['特休', '病假', '事假'].map(function (o) { return '<option' + (o === val ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select>'; }
  function dates(id, a, b, help) {
    return '<div class="field"><label for="' + id + '">期間<span class="req">*</span></label><div class="range"><input id="' + id + '" class="fld" value="' + a + '"><span style="color:#57606A">–</span><input aria-label="結束日期" class="fld" value="' + b + '"></div>' + (help || '') + '</div>';
  }

  function sheet(f) {
    var b = '';
    if (f.form) {
      b = alertBox('err', 'alertC', '<p class="t-strong">有 2 個地方需要修正才能送出</p><ul style="margin-top:2px;padding-left:18px"><li><a href="#" data-focus="f-type">特休餘額不足</a></li><li><a href="#" data-focus="f-reason">事由為必填</a></li></ul>', '', 'alert') +
        '<div class="field"><label for="f-type">假別<span class="req">*</span></label>' + sel('f-type', '特休').replace('class="fld"', 'class="fld fld-err"') + '<p class="err-msg">特休餘額不足：這次需要 8 天，目前剩 7.5 天。可改成 7.5 天特休加 0.5 天事假。</p></div>' +
        dates('f-start', '2026/11/10', '2026/11/19', '<p class="help">共 8 個工作天（已扣除週末）</p>') +
        '<div class="field"><label for="f-reason">事由<span class="req">*</span></label><textarea id="f-reason" class="fld fld-err" rows="3" placeholder="例如：家庭旅遊"></textarea><p class="err-msg">請填寫事由</p></div>' +
        '<div class="field"><label for="f-proxy">職務代理人</label><input id="f-proxy" class="fld" value="陳柏宇"></div>';
    } else if (f.upload) {
      var files = [
        ['診斷證明書.pdf', '1.2 MB · 已上傳', 'ok'],
        ['收據.heic', '2.8 MB · 不支援 HEIC 格式，請轉成 JPG 或 PDF 後重新上傳', 'bad'],
        ['住院證明_掃描.pdf', '18.4 MB · 超過 10 MB 上限，請壓縮後重新上傳', 'bad'],
        ['處方箋.jpg', '640 KB · 上傳中斷，請重試', 'retry']
      ];
      b = '<div class="field"><label for="u-type">假別<span class="req">*</span></label>' + sel('u-type', '病假') + '</div>' + dates('u-start', '2026/10/26', '2026/10/29') +
        '<div style="display:flex;flex-direction:column;gap:8px"><p>附件<span class="req">*</span></p><p class="help" style="margin-top:-6px">病假超過 3 天需附證明。PDF、JPG、PNG，單檔 10 MB 以內。</p>' +
        '<button class="btn" style="height:56px;border-style:dashed;color:#3D444D">' + ic('upload') + '選擇檔案或拖曳到這裡</button>';
      files.forEach(function (x) {
        var ok = x[2] === 'ok';
        b += '<div class="file' + (ok ? '' : ' bad') + '"><span class="alert-ic" style="color:' + (ok ? '#1A6B33' : '#B42318') + '">' + ic('file') + '</span>' +
          '<div style="flex:1;min-width:0"><p class="ell">' + x[0] + '</p><p style="font-size:12px;color:' + (ok ? '#57606A' : '#B42318') + '">' + x[1] + '</p></div>' +
          (x[2] === 'retry' ? '<button class="btn btn-sm btn-t">重試</button>' : '') + xBtn('移除 ' + x[0]) + '</div>';
      });
      b += '</div>';
    } else {
      b = '<div class="field"><label for="s-type">假別<span class="req">*</span></label>' + sel('s-type', '特休') + '</div>' + dates('s-start', '2026/12/21', '2026/12/23') +
        '<div class="field"><label for="s-reason">事由<span class="req">*</span></label><textarea id="s-reason" class="fld" rows="3">年底家庭旅遊</textarea></div>';
    }
    return '<div class="overlay"></div><div class="sheet" role="dialog" aria-label="新增請假申請">' +
      '<div class="dlg-h" style="border-bottom:1px solid #E3E5E8"><p>新增請假申請</p>' + xBtn() + '</div>' +
      '<div class="sheet-b">' + b + '</div><div class="dlg-f"><button class="btn">取消</button><button class="btn btn-p">送出申請</button></div></div>';
  }

  function dialog(w, title, body, foot, closable) {
    return '<div class="center"><div class="dlg" role="alertdialog" aria-label="' + title + '" style="width:' + w + 'px"><div class="dlg-h"><p>' + title + '</p>' + (closable ? xBtn() : '') + '</div>' +
      '<div class="dlg-b">' + body + '</div><div class="dlg-f">' + foot + '</div></div></div>';
  }

  function overlays(f) {
    var h = '';
    if (f.sheet) h += sheet(f);
    if (f.dim) h += '<div class="overlay" style="background:rgba(15,23,42,.45)"></div>';
    if (f.e401) h += dialog(440, '登入已逾時', '<p>為了保護你的資料，閒置超過 30 分鐘需要重新登入。</p>' + alertBox('ok', 'check', '<span>你剛才填的內容已暫存，登入後會回到這個頁面。</span>'),
      '<button class="btn">以其他帳號登入</button><button class="btn btn-p">重新登入</button>', false);
    if (f.conflict) h += dialog(520, '這筆申請已被更新',
      '<p>你在編輯 LV-2026-0431 的時候，<b class="t-strong">王志明（主管）</b>在 14:02 修改了這筆申請。請選擇要保留哪個版本。</p>' +
      '<div class="diff"><div class="th"><span>欄位</span><span>你的版本</span><span>最新版本</span></div>' +
      '<div><span style="color:#57606A">結束日期</span><span>11/05</span><span class="t-strong">11/04</span></div>' +
      '<div><span style="color:#57606A">狀態</span><span>待審核</span><span class="t-strong">退回修改</span></div></div>' +
      '<p style="color:#57606A">主管留言：「11/05 部門有季度會議，請改到 11/04 結束。」</p>',
      '<button class="btn">仍以我的版本送出</button><button class="btn btn-p">載入最新版本</button>', true);
    if (f.unsaved) h += dialog(420, '要捨棄這份申請嗎？', '<p>你填的內容還沒送出，離開後不會保留。</p>', '<button class="btn btn-d">捨棄並離開</button><button class="btn btn-p">繼續編輯</button>', true);
    if (f.saveFail) h += '<div class="toast" role="alert"><span class="alert-ic" style="color:#B42318">' + ic('alertC') + '</span><div style="flex:1"><p class="t-strong">無法撤回 LV-2026-0431</p><p class="t-sub">伺服器暫時沒有回應，申請仍是「待審核」。</p></div><button class="btn btn-sm btn-t">重試</button>' + xBtn() + '</div>';
    if (f.e429) h += '<div class="toast" role="status"><span class="alert-ic" style="color:#8F5A00">' + ic('alertT') + '</span><div style="flex:1"><p class="t-strong">匯出次數已達上限</p><p class="t-sub">每分鐘最多匯出 3 次，請 28 秒後再試。按鈕會在時間到時自動恢復。</p></div>' + xBtn() + '</div>';
    return h;
  }

  function renderSim() {
    var f = flags();
    var cur = ALL.filter(function (x) { return x.id === state.sel; })[0];

    document.querySelectorAll('#picks .pick').forEach(function (b) {
      b.setAttribute('aria-pressed', String(Number(b.getAttribute('data-pick')) === state.sel));
    });

    document.getElementById('info').innerHTML =
      '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px"><span class="num" style="font-weight:700;color:#57606A">' + cur.num + '</span>' +
      '<h2 style="font-size:20px;line-height:1.3;font-weight:700">' + cur.title + '</h2><span class="tag tag-code">' + cur.code + '</span>' + lvTag(cur) +
      '<span style="flex:1"></span><button class="btn btn-sm" data-act="prev">上一個</button><button class="btn btn-sm" data-act="next">下一個</button></div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">' +
      '<div><p style="margin-bottom:2px;font-size:12px;font-weight:700;color:#57606A">什麼時候會發生</p><p>' + cur.trigger + '</p></div>' +
      '<div><p style="margin-bottom:2px;font-size:12px;font-weight:700;color:#57606A">UI 怎麼處理</p><p>' + cur.handling + (cur.id === 2 ? '（可以按「申請存取權限」試試）' : '') + '</p></div>' +
      '<div><p style="margin-bottom:2px;font-size:12px;font-weight:700;color:#57606A">使用者下一步</p><p>' + cur.next + '</p></div></div>';

    var inner = '';
    if (f.app) {
      inner = '<div style="height:100%;display:flex;flex-direction:column">' + banners(f) +
        '<div style="flex:1;min-height:0;display:flex">' + sidebar(f) +
        '<div style="flex:1;min-width:0;display:flex;flex-direction:column">' + pageHeader(f) +
        '<div style="flex:1;min-height:0;overflow-y:auto">' + (f.list ? listPage(f) : fullContent(f)) + '</div>' +
        (f.batch ? '<div style="flex-shrink:0;display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid #E3E5E8;background:#FFFFFF">' +
          '<button class="btn btn-t btn-i" aria-label="取消選取">' + ic('x') + '</button><span class="t-strong num">已選 2 筆</span>' +
          '<span style="width:1px;height:24px;background:#E3E5E8;margin:0 4px"></span><button class="btn">重試撤回</button><button class="btn">匯出</button></div>' : '') +
        '</div></div></div>';
    } else {
      inner = f.e503 ? maintenance() : sso();
    }
    document.getElementById('frame').innerHTML =
      '<div class="frame-scroll"><div class="frame-inner">' + inner + '</div></div>' + overlays(f);
  }

  function select(id) {
    state.sel = id;
    state.requested = false;
    renderSim();
    if (location.hash !== '#sim/' + id) history.replaceState(null, '', '#sim/' + id);
  }

  /* ---------- routing ---------- */
  function route() {
    var m = /^#sim(?:\/(\d+))?$/.exec(location.hash);
    var isSim = !!m;
    document.getElementById('view-list').hidden = isSim;
    document.getElementById('view-sim').hidden = !isSim;
    document.getElementById('tab-list').setAttribute('aria-selected', String(!isSim));
    document.getElementById('tab-sim').setAttribute('aria-selected', String(isSim));
    if (isSim) {
      var id = m[1] ? Math.min(23, Math.max(1, parseInt(m[1], 10))) : state.sel;
      if (id !== state.sel) { state.sel = id; state.requested = false; }
      renderSim();
    }
    window.scrollTo(0, 0);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-pick],[data-act],[data-focus]');
    if (!t) {
      // keep mock links/buttons inside the frame from navigating
      if (e.target.closest('#frame a[href="#"]')) e.preventDefault();
      return;
    }
    if (t.hasAttribute('data-pick')) return select(Number(t.getAttribute('data-pick')));
    if (t.hasAttribute('data-focus')) {
      e.preventDefault();
      var el = document.getElementById(t.getAttribute('data-focus'));
      if (el) el.focus();
      return;
    }
    var a = t.getAttribute('data-act');
    if (a === 'prev') select(state.sel > 1 ? state.sel - 1 : 23);
    else if (a === 'next') select(state.sel < 23 ? state.sel + 1 : 1);
    else if (a === 'request') { state.requested = true; renderSim(); }
    else if (a === 'copy') {
      var done = function () { var s = t.querySelector('span'); if (s) s.textContent = '已複製'; };
      if (navigator.clipboard) navigator.clipboard.writeText('ERR-7F3A-29C1').then(done, done); else done();
    }
  });
  window.addEventListener('hashchange', route);

  renderList();
  renderPicks();
  route();
})();
</script>
